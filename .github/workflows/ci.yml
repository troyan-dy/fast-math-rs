name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  # A new push to a pull request supersedes the run of the previous one; runs on master all finish
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # A pull request into master is a release once merged, so it must carry a new version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the base branch and the tags
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project python scripts/version.py check "origin/${{ github.base_ref }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uvx pyright@1.1.414  # the pin of the Makefile
      - run: uv run stubtest fast_math
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
        env:
          # The bindings are configured against an interpreter: the one of the venv
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python

  rust-test:
    # The core alone, without Python: `cargo test` builds without the `python` feature
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  test:
    # Every operating system: the float results come from the platform's libm, as Python's own do
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term

  free-threaded:
    # The tests on CPython 3.14t without PYTHON_GIL=0: importing the extension must leave the GIL off by itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14t"
      - run: make test-free-threaded

  benchmarks:
    # A smoke run of benchmarks/run.py, so it keeps working; the figures of a GitHub runner are too noisy to
    # gate on, docs/benchmarks.md holds the baseline
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python benchmarks/run.py --quick

  wheels:
    # Every release target builds on every pull request, so a platform that breaks fails before the merge
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/wheels.yml
