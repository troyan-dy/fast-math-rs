# flake8 reads no pyproject.toml: this file holds only the wemake-python-styleguide (WPS) checks, ruff the rest
[flake8]
select = WPS
max-line-length = 120
exclude = .git,.venv,build,dist,target,__pycache__,.mypy_cache,.ruff_cache,.pytest_cache,.hypothesis
per-file-ignores =
    # The package is its re-exports: the functions of the extension, __all__ and __version__
    python/fast_math/__init__.py: WPS235, WPS410, WPS412
    # A command line tool of the standard library only, kept in one file: it prints its output
    scripts/version.py: WPS202, WPS421
    # One script that prints its table; the Python baselines keep the names of the Rust core (n, d, s, a, x), and
    # the inputs of a case are spelled out in its label
    benchmarks/run.py: WPS111, WPS202, WPS421, WPS432
    # The tests pass the arguments by the names of the API (a, b, x, n), compare a call with its Python reference
    # on one line, pin edge cases as @example decorators and literal values, signed zeros included, and check
    # the exact type of a result: isinstance() would take a bool for an int
    tests/*.py: WPS111, WPS202, WPS216, WPS218, WPS221, WPS226, WPS358, WPS432, WPS516
